---
- name: Application Environment Setup (PHP, Composer, Git, App User)
  hosts: upms_app
  vars_prompt:
    - name: ansible_password
      prompt: "Enter SSH password"
      private: true
    - name: git_username
      prompt: "Enter Git Username"
      private: false
    - name: git_password
      prompt: "Enter Git Password or Personal Access Token"
      private: true
  vars:
    php_version: "8.5"
    app_user: "www-data"
    app_group: "www-data"
    app_user_home: "/var/www"
    project_root: "/var/www/upms"
    repo_url: "https://{{ git_username | urlencode }}:{{ git_password | urlencode }}@github.com/snbhattacharjya/upms.git"
    web_user: "{{ 'www-data' if ansible_facts['os_family'] == 'Debian' else 'nginx' if ansible_facts['os_family'] == 'RedHat' else 'http' }}"

  become: true
  tasks:
    # ---------------------------------------------------------
    # System Packages & PHP Setup
    # ---------------------------------------------------------
    - name: Ubuntu/Debian | Install prerequisites
      ansible.builtin.apt:
        name: [software-properties-common, ca-certificates, apt-transport-https, lsb-release, gnupg, curl, unzip, git, nginx, supervisor, python3-debian]
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Ubuntu | Add ondrej/php PPA
      ansible.builtin.deb822_repository:
        name: ondrej-php
        types: [deb]
        uris: ["https://ppa.launchpadcontent.net/ondrej/php/ubuntu"]
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [main]
        signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x4F4EA0AAE5267A6C"
        state: present
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Debian | Add sury PHP repository
      ansible.builtin.deb822_repository:
        name: sury-php
        types: [deb]
        uris: ["https://packages.sury.org/php/"]
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [main]
        signed_by: "https://packages.sury.org/php/apt.gpg"
        state: present
      when: ansible_facts['distribution'] == "Debian"

    - name: Ubuntu/Debian | Install PHP and extensions
      ansible.builtin.apt:
        name:
          - "php{{ php_version }}"
          - "php{{ php_version }}-cli"
          - "php{{ php_version }}-swoole"
          - "php{{ php_version }}-common"
          - "php{{ php_version }}-devel"
          - "php{{ php_version }}-bcmath"
          - "php{{ php_version }}-bz2"
          - "php{{ php_version }}-curl"
          - "php{{ php_version }}-gd"
          - "php{{ php_version }}-igbinary"
          - "php{{ php_version }}-imagick"
          - "php{{ php_version }}-intl"
          - "php{{ php_version }}-mbstring"
          - "php{{ php_version }}-mysql"
          - "php{{ php_version }}-mysqlnd"
          - "php{{ php_version }}-opcache"
          - "php{{ php_version }}-pgsql"
          - "php{{ php_version }}-readline"
          - "php{{ php_version }}-process"
          - "php{{ php_version }}-pear"
          - "php{{ php_version }}-soap"
          - "php{{ php_version }}-sqlite3"
          - "php{{ php_version }}-xml"
          - "php{{ php_version }}-pdo"
          - "php{{ php_version }}-zip"
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: RHEL/CentOS | Install EPEL repository
      ansible.builtin.package:
        name: epel-release
        state: present
      when: ansible_facts['os_family'] == "RedHat" and ansible_facts['distribution'] != "Fedora"
      ignore_errors: true

    - name: RHEL/CentOS | Install Remi repository
      ansible.builtin.package:
        name: "https://rpms.remirepo.net/enterprise/remi-release-{{ ansible_facts['distribution_major_version'] }}.rpm"
        state: present
        disable_gpg_check: yes
      when: ansible_facts['os_family'] == "RedHat" and ansible_facts['distribution'] != "Fedora"
      ignore_errors: true

    - name: RHEL/CentOS | Enable Remi PHP module stream
      ansible.builtin.command: "{{ item }}"
      loop:
        - "dnf module reset php -y"
        - "dnf module enable php:remi-{{ php_version }} -y"
      when: ansible_facts['os_family'] == "RedHat" and ansible_facts['distribution'] != "Fedora" and ansible_facts['pkg_mgr'] == "dnf"


    - name: RHEL/Fedora | Install PHP, Nginx and extensions
      ansible.builtin.package:
        name: [nginx, php, php-cli, php-swoole, supervisor, php-common, php-bcmath, php-bz2, php-curl, php-gd, php-intl, php-mbstring, php-mysqlnd, php-opcache, php-pgsql, php-pecl-redis, php-pecl-imagick, php-soap, php-pdo, php-xml, php-zip, unzip, git]
        state: latest
      when: ansible_facts['os_family'] == "RedHat"

    - name: Arch Linux | Install PHP, Nginx and extensions
      ansible.builtin.package:
        name: [nginx, php, php-swoole, supervisor, php-gd, php-intl, php-pgsql, php-sqlite, php-redis, imagemagick, composer, git, unzip]
        state: present
      when: ansible_facts['os_family'] == "Archlinux"

    # ---------------------------------------------------------
    # Install Composer
    # ---------------------------------------------------------
    - name: Check if Composer is installed
      ansible.builtin.shell: command -v composer
      register: composer_check
      failed_when: false
      changed_when: false

    - name: Download Composer installer
      ansible.builtin.get_url:
        url: https://getcomposer.org/installer
        dest: /tmp/composer-setup.php
      when: composer_check.rc != 0

    - name: Install Composer
      ansible.builtin.command: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
      when: composer_check.rc != 0

    - name: Remove Composer setup script
      ansible.builtin.file:
        path: /tmp/composer-setup.php
        state: absent
      when: composer_check.rc != 0

    # ---------------------------------------------------------
    # User Setup & SSH Key Configuration
    # ---------------------------------------------------------
    - name: Create App Group
      ansible.builtin.group:
        name: "{{ app_group }}"
        state: present

    - name: Create App User
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        groups: "{{ web_user }}"
        append: yes
        shell: /bin/bash
        home: "{{ app_user_home }}"
        create_home: yes



    # ---------------------------------------------------------
    # Application Deployment (Git & Composer)
    # ---------------------------------------------------------
    - name: Ensure project root directory exists and has correct ownership
      ansible.builtin.file:
        path: "{{ project_root }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Clone Git Repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ project_root }}"
        force: yes
      become_user: "{{ app_user }}"

    - name: Install Composer Dependencies
      ansible.builtin.command: composer install --no-dev --optimize-autoloader
      args:
        chdir: "{{ project_root }}"
      environment:
        PATH: "/usr/local/bin:/usr/bin:/bin"
      become_user: "{{ app_user }}"

    - name: Set correct permissions for Laravel storage and cache directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ web_user }}"
        mode: "0775"
        recurse: yes
      loop:
        - "{{ project_root }}/storage"
        - "{{ project_root }}/bootstrap/cache"
      ignore_errors: true

    - name: Copy .env.example to .env
      ansible.builtin.copy:
        src: "{{ project_root }}/.env.example"
        dest: "{{ project_root }}/.env"
        remote_src: yes
        force: no
      become_user: "{{ app_user }}"
      ignore_errors: true

    - name: Check if APP_KEY is empty in .env
      ansible.builtin.shell: grep -E "^APP_KEY=$" {{ project_root }}/.env || grep -E "^APP_KEY=$" {{ project_root }}/.env.example
      register: app_key_check
      failed_when: false
      changed_when: false
      become_user: "{{ app_user }}"

    - name: Generate Laravel App Key
      ansible.builtin.command: php artisan key:generate --force
      args:
        chdir: "{{ project_root }}"
      when: app_key_check.rc == 0
      become_user: "{{ app_user }}"
      ignore_errors: true

    # ---------------------------------------------------------
    # Supervisor Configuration (Octane, Queue, Schedule)
    # ---------------------------------------------------------
    - name: Ensure Supervisor is started and enabled
      ansible.builtin.service:
        name: supervisor
        state: started
        enabled: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Ensure Supervisord is started and enabled (RedHat)
      ansible.builtin.service:
        name: supervisord
        state: started
        enabled: yes
      when: ansible_facts['os_family'] == "RedHat"

    - name: Copy Supervisor templates
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "/etc/supervisor/conf.d/{{ item | basename | regex_replace('\\.j2$', '') }}"
      loop:
        - ../templates/supervisor/octane.conf.j2
        - ../templates/supervisor/queue.conf.j2
        - ../templates/supervisor/schedule.conf.j2
      when: ansible_facts['os_family'] == "Debian"
      notify: Reload Supervisor

    - name: Copy Supervisor templates (RedHat)
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "/etc/supervisord.d/{{ item | basename | regex_replace('\\.j2$', '') | regex_replace('\\.conf$', '.ini') }}"
      loop:
        - ../templates/supervisor/octane.conf.j2
        - ../templates/supervisor/queue.conf.j2
        - ../templates/supervisor/schedule.conf.j2
      when: ansible_facts['os_family'] == "RedHat"
      notify: Reload Supervisor

  handlers:
    - name: Reload Supervisor
      ansible.builtin.shell: supervisorctl reread && supervisorctl update && supervisorctl restart all
